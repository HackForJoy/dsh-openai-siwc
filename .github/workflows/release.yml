name: release

# On a v* tag:
# - github-release: verify, build, and create a GitHub Release whose notes come
#   from CHANGELOG.md, with the npm tarball and its SHA-256 attached.
# - npm-publish: publish with npm Trusted Publishing (GitHub OIDC instead of a
#   stored token; the version carries a provenance attestation). It runs only
#   when the repository variable NPM_TRUSTED_PUBLISHING is "true", i.e. after
#   the trusted publisher is configured on npmjs.com (package settings →
#   Trusted Publisher → GitHub Actions: HackForJoy/dsh-openai-siwc, workflow
#   release.yml, environment npm). A version already on npm is skipped, so the
#   job can be re-run safely.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Tag must match package.json version
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      # npm pack reproduces the tarball npm publish uploads byte for byte, so the
      # attached asset and SHA256SUMS match the package on npmjs.com.
      - name: Pack and checksum
        run: |
          npm pack
          sha256sum hackforjoy-dsh-openai-siwc-*.tgz > SHA256SUMS
          cat SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { next }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG section for $version"; exit 1; }
          printf '\n---\nVerify the attached package: `sha256sum -c SHA256SUMS`\n' >> notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag hackforjoy-dsh-openai-siwc-*.tgz SHA256SUMS

  npm-publish:
    if: vars.NPM_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Use an npm CLI that supports trusted publishing
        run: npm install --global npm@^11.5.1
      - name: Tag must match package.json version
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - name: Skip a version that is already published
        id: published
        run: |
          spec="$(node -p 'const p = require("./package.json"); p.name + "@" + p.version')"
          if npm view "$spec" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "$spec is already on npm; nothing to publish"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.exists != 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - if: steps.published.outputs.exists != 'true'
        run: npm publish --access public
